            - button "What documentation comes with each order?" [expanded] [ref=e504] [cursor=pointer]
            - paragraph [ref=e511]: Every research kit is paired with a batch-specific certificate of analysis listing lot number, HPLC purity, and mass-spec confirmation. Storage and handling notes are included on the packing slip.
          - generic [ref=e512]:
            - button "How is purity verified?" [ref=e513] [cursor=pointer]
            - paragraph [ref=e518]: Each batch is independently tested by reverse-phase HPLC and high-resolution mass spectrometry, then verified by Janoshik Analytical. We retain a reference sample from every lot for cross-verification on request.
          - generic [ref=e519]:
            - button "How is the product packaged?" [ref=e520] [cursor=pointer]
            - paragraph [ref=e525]: Products are sealed inside tamper-evident research kits with pre-filled research devices. Cold-chain packaging is used where the compound requires refrigeration.
          - generic [ref=e526]:
            - button "What's the return policy?" [ref=e527] [cursor=pointer]
            - paragraph [ref=e532]: We don't accept returns on opened or temperature-compromised kits. If a research kit arrives damaged or out of spec, contact us within 48 hours of receipt and we'll replace or refund.
          - generic [ref=e533]:
            - button "How can I pay?" [ref=e534] [cursor=pointer]
            - paragraph [ref=e539]: Bank transfer, card payments via our checkout, and crypto on request. Institutional purchase orders are accepted with prior credit approval.
          - generic [ref=e540]:
            - button "Who are these materials for?" [ref=e541] [cursor=pointer]
            - paragraph [ref=e546]: We supply laboratories and qualified researchers. Everything in the catalogue is a research-grade reference material, intended for laboratory research only — not for human or veterinary use, and not for diagnostic or therapeutic purposes.
          - generic [ref=e547]:
            - button "How should a kit be stored once it arrives?" [ref=e548] [cursor=pointer]
            - paragraph [ref=e553]: Refrigerate between 2–8°C and do not freeze. Kits ship sealed in a fixed-volume format, so keep them sealed until the material is needed. The storage and handling notes for the specific lot are printed on the packing slip and on each product page.
