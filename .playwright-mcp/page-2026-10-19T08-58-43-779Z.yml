          - generic [ref=f2e529]:
            - button "What documentation comes with each order?" [ref=f2e530] [cursor=pointer]
            - paragraph [ref=f2e535]: Every research kit is paired with a batch-specific certificate of analysis listing lot number, HPLC purity, and mass-spec confirmation. Storage and handling notes are included on the packing slip.
          - generic [ref=f2e536]:
            - button "How is purity verified?" [ref=f2e537] [cursor=pointer]
            - paragraph [ref=f2e542]: Each batch is independently tested by reverse-phase HPLC and high-resolution mass spectrometry, then verified by Janoshik Analytical. We retain a reference sample from every lot for cross-verification on request.
          - generic [ref=f2e543]:
            - button "How is the product packaged?" [ref=f2e544] [cursor=pointer]
            - paragraph [ref=f2e549]: Products are sealed inside tamper-evident research kits with pre-filled research devices. Cold-chain packaging is used where the compound requires refrigeration.
          - generic [ref=f2e550]:
            - button "What's the return policy?" [ref=f2e551] [cursor=pointer]
            - paragraph [ref=f2e556]: We don't accept returns on opened or temperature-compromised kits. If a research kit arrives damaged or out of spec, contact us within 48 hours of receipt and we'll replace or refund.
          - generic [ref=f2e557]:
            - button "How can I pay?" [ref=f2e558] [cursor=pointer]
            - paragraph [ref=f2e563]: Bank transfer, card payments via our checkout, and crypto on request. Institutional purchase orders are accepted with prior credit approval.
          - generic [ref=f2e564]:
            - button "Who are these materials for?" [ref=f2e565] [cursor=pointer]
            - paragraph [ref=f2e570]: We supply laboratories and qualified researchers. Everything in the catalogue is a research-grade reference material, intended for laboratory research only — not for human or veterinary use, and not for diagnostic or therapeutic purposes.
          - generic [ref=f2e571]:
            - button "How should a kit be stored once it arrives?" [ref=f2e572] [cursor=pointer]
            - paragraph [ref=f2e577]: Refrigerate between 2–8°C and do not freeze. Kits ship sealed in a fixed-volume format, so keep them sealed until the material is needed. The storage and handling notes for the specific lot are printed on the packing slip and on each product page.
