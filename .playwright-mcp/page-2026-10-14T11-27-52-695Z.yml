    - generic [ref=f26e582]:
      - generic [ref=f26e583]:
        - generic [ref=f26e584]: FAQ
        - heading "Frequently asked questions." [level=2] [ref=f26e585]
      - generic [ref=f26e586]:
        - figure [ref=f26e587]:
          - img "Lyfe Health research team verifying peptide batches in the lab" [ref=f26e588]
        - generic [ref=f26e589]:
          - generic [ref=f26e590]:
            - button "What documentation comes with each order?" [expanded] [ref=f26e591] [cursor=pointer]
            - paragraph [ref=f26e598]: Every research kit is paired with a batch-specific certificate of analysis listing lot number, HPLC purity, and mass-spec confirmation. Storage and handling notes are included on the packing slip.
          - generic [ref=f26e599]:
            - button "How is purity verified?" [ref=f26e600] [cursor=pointer]
            - paragraph [ref=f26e605]: Each batch is independently tested by reverse-phase HPLC and high-resolution mass spectrometry, then verified by Janoshik Analytical. We retain a reference sample from every lot for cross-verification on request.
          - generic [ref=f26e606]:
            - button "How is the product packaged?" [ref=f26e607] [cursor=pointer]
            - paragraph [ref=f26e612]: Products are sealed inside tamper-evident research kits with pre-filled research devices. Cold-chain packaging is used where the compound requires refrigeration.
          - generic [ref=f26e613]:
            - button "What's the return policy?" [ref=f26e614] [cursor=pointer]
            - paragraph [ref=f26e619]: We don't accept returns on opened or temperature-compromised kits. If a research kit arrives damaged or out of spec, contact us within 48 hours of receipt and we'll replace or refund.
          - generic [ref=f26e620]:
            - button "How can I pay?" [ref=f26e621] [cursor=pointer]
            - paragraph [ref=f26e626]: Bank transfer, card payments via our checkout, and crypto on request. Institutional purchase orders are accepted with prior credit approval.
          - generic [ref=f26e627]:
            - button "Who are these materials for?" [ref=f26e628] [cursor=pointer]
            - paragraph [ref=f26e633]: We supply laboratories and qualified researchers. Everything in the catalogue is a research-grade reference material, intended for laboratory research only — not for human or veterinary use, and not for diagnostic or therapeutic purposes.
          - generic [ref=f26e634]:
            - button "How should a kit be stored once it arrives?" [ref=f26e635] [cursor=pointer]
            - paragraph [ref=f26e640]: Refrigerate between 2–8°C and do not freeze. Kits ship sealed in a fixed-volume format, so keep them sealed until the material is needed. The storage and handling notes for the specific lot are printed on the packing slip and on each product page.
