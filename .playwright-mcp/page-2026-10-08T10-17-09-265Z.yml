      - generic [ref=f45e76]:
        - generic [ref=f45e77]:
          - text: "01"
          - heading "Our standards" [level=2] [ref=f45e78]
          - paragraph [ref=f45e79]: Quality is the work. These are the controls that sit behind every kit we ship.
        - list [ref=f45e80]:
          - listitem [ref=f45e81]:
            - generic [ref=f45e82]: "01"
            - heading "Verified sourcing" [level=3] [ref=f45e83]
            - paragraph [ref=f45e84]: Materials come from manufacturers held to strict testing, handling and documentation requirements on every production run.
          - listitem [ref=f45e85]:
            - generic [ref=f45e86]: "02"
            - heading "Controlled processes" [level=3] [ref=f45e87]
            - paragraph [ref=f45e88]: Repeatable, documented handling so each unit matches the one before it — the point of a reference material is that it does not drift.
          - listitem [ref=f45e89]:
            - generic [ref=f45e90]: "03"
            - heading "Sealed packaging" [level=3] [ref=f45e91]
            - paragraph [ref=f45e92]: Tamper-evident research kits, with cold-chain packing where the compound requires refrigeration.
          - listitem [ref=f45e93]:
            - generic [ref=f45e94]: "04"
            - heading "Retained samples" [level=3] [ref=f45e95]
            - paragraph [ref=f45e96]: A reference sample is kept from every lot, so a result can be cross-checked against the material it came from.
      - generic [ref=f45e97]:
        - generic [ref=f45e98]:
          - text: "02"
          - heading "Verified purity" [level=2] [ref=f45e99]
          - paragraph [ref=f45e100]: Purity is measured, not asserted. Each batch goes through the same two-instrument check before it is released.
        - generic [ref=f45e101]:
          - figure [ref=f45e102]:
            - img "HPLC instrumentation used for peptide purity verification." [ref=f45e103]
          - list [ref=f45e104]:
            - listitem [ref=f45e105]:
              - generic [ref=f45e106]: "01"
              - generic [ref=f45e107]:
                - heading "Reverse-phase HPLC" [level=3] [ref=f45e108]
                - paragraph [ref=f45e109]: Separates the target compound from related substances and quantifies purity as a percentage of total peak area.
            - listitem [ref=f45e110]:
              - generic [ref=f45e111]: "02"
              - generic [ref=f45e112]:
                - heading "High-resolution mass spectrometry" [level=3] [ref=f45e113]
                - paragraph [ref=f45e114]: Confirms molecular identity against the expected mass — purity alone does not prove you have the right molecule.
            - listitem [ref=f45e115]:
              - generic [ref=f45e116]: "03"
              - generic [ref=f45e117]:
                - heading "Independent verification" [level=3] [ref=f45e118]
                - paragraph [ref=f45e119]: Analysis is carried out by Janoshik Analytical rather than in-house, and the report is published as received.
        - generic [ref=f45e120]:
