        - heading "Every claim, traceable to a lot." [level=1] [ref=f45e59]
        - paragraph [ref=f45e60]: How we source, handle and verify research materials — and the published analysis behind each one.
        - generic [ref=f45e61]:
          - generic [ref=f45e62]:
            - term [ref=f45e63]: "5"
            - definition [ref=f45e64]: Published reports
