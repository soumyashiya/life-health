      - generic [ref=f30e673]:
        - generic [ref=f30e674]:
          - button "What documentation comes with each order?" [ref=f30e675] [cursor=pointer]
          - paragraph [ref=f30e680]: Every research kit is paired with a batch-specific certificate of analysis listing lot number, HPLC purity, and mass-spec confirmation. Storage and handling notes are included on the packing slip.
        - generic [ref=f30e681]:
          - button "How is purity verified?" [ref=f30e682] [cursor=pointer]
          - paragraph [ref=f30e687]: Each batch is independently tested by reverse-phase HPLC and high-resolution mass spectrometry, then verified by Janoshik Analytical. We retain a reference sample from every lot for cross-verification on request.
        - generic [ref=f30e688]:
          - button "How is the product packaged?" [ref=f30e689] [cursor=pointer]
          - paragraph [ref=f30e694]: Products are sealed inside tamper-evident research kits with pre-filled research devices. Cold-chain packaging is used where the compound requires refrigeration.
        - generic [ref=f30e695]:
          - button "What's the return policy?" [ref=f30e696] [cursor=pointer]
          - paragraph [ref=f30e701]: We don't accept returns on opened or temperature-compromised kits. If a research kit arrives damaged or out of spec, contact us within 48 hours of receipt and we'll replace or refund.
        - generic [ref=f30e702]:
          - button "How can I pay?" [ref=f30e703] [cursor=pointer]
          - paragraph [ref=f30e708]: Bank transfer, card payments via our checkout, and crypto on request. Institutional purchase orders are accepted with prior credit approval.
        - generic [ref=f30e709]:
          - button "Who are these materials for?" [ref=f30e710] [cursor=pointer]
          - paragraph [ref=f30e715]: We supply laboratories and qualified researchers. Everything in the catalogue is a research-grade reference material, intended for laboratory research only — not for human or veterinary use, and not for diagnostic or therapeutic purposes.
        - generic [ref=f30e716]:
          - button "How should a kit be stored once it arrives?" [ref=f30e717] [cursor=pointer]
          - paragraph [ref=f30e722]: Refrigerate between 2–8°C and do not freeze. Kits ship sealed in a fixed-volume format, so keep them sealed until the material is needed. The storage and handling notes for the specific lot are printed on the packing slip and on each product page.
