        - generic [ref=f35e1223]:
          - generic [ref=f35e1224]:
            - button "What documentation comes with each order?" [expanded] [ref=f35e1225] [cursor=pointer]
            - paragraph [ref=f35e1232]: Every research kit is paired with a batch-specific certificate of analysis listing lot number, HPLC purity, and mass-spec confirmation. Storage and handling notes are included on the packing slip.
          - generic [ref=f35e1233]:
            - button "How is purity verified?" [ref=f35e1234] [cursor=pointer]
            - paragraph [ref=f35e1239]: Each batch is independently tested by reverse-phase HPLC and high-resolution mass spectrometry, then verified by Janoshik Analytical. We retain a reference sample from every lot for cross-verification on request.
          - generic [ref=f35e1240]:
            - button "How is the product packaged?" [ref=f35e1241] [cursor=pointer]
            - paragraph [ref=f35e1246]: Products are sealed inside tamper-evident research kits with pre-filled research devices. Cold-chain packaging is used where the compound requires refrigeration.
          - generic [ref=f35e1247]:
            - button "What's the return policy?" [ref=f35e1248] [cursor=pointer]
            - paragraph [ref=f35e1253]: We don't accept returns on opened or temperature-compromised kits. If a research kit arrives damaged or out of spec, contact us within 48 hours of receipt and we'll replace or refund.
          - generic [ref=f35e1254]:
            - button "How can I pay?" [ref=f35e1255] [cursor=pointer]
            - paragraph [ref=f35e1260]: Bank transfer, card payments via our checkout, and crypto on request. Institutional purchase orders are accepted with prior credit approval.
